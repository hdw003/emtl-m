[project]
name = "emtl-m"
version = "0.4.0"
description = "东方财富证券(18.cn) 网页交易接口的现代 Python 客户端。逆向自 riiy/emtl(MIT)。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "rsa>=4.9",  # 纯 Python RSA，登录密码加密（避免 cryptography 本地编译）
]

[project.optional-dependencies]
captcha = ["ddddocr>=1.4.11"]
tests = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
emt = "emtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emtl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B", "C4", "E", "F", "I", "PIE", "PLC", "PLE", "PT", "PTH",
    "Q", "RUF", "S", "UP", "W",
]
ignore = [
    "S101",  # pytest assert
    "S105", "S106",  # 测试里出现的假账号/密码 fixture
    "S603", "S607",
    "RUF001", "RUF002", "RUF003",  # 中文全角标点在 docstring/注释的误报
    "E501",  # 中文文本行长
]
[tool.ruff.lint.isort]
known-first-party = ["emtl"]

[tool.hatch.build.targets.wheel.force-include]
"src/emtl/py.typed" = "emtl/py.typed"
