name: Python validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra tests
      - run: uv run --locked --extra tests python -m pytest
      - run: uv run --locked --extra tests ruff check src tests
      - run: uv run --locked --extra tests ruff format --check src/emtl/quant tests/quant
      - run: uv build
