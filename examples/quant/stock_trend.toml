# A 股主板趋势研究示例；多年结果需要补齐分红送转，价格单位为元，量为股。
data = "../../.quant/stock-daily.csv"
initial_cash = 1000000
rebalance = "weekly"
start = "2021-01-01"

[strategy]
name = "dual_ma"
fast = 50
slow = 200

[risk]
max_position = 0.30
max_gross = 0.90
max_drawdown = 0.20
stop_loss = 0.10
trailing_stop = 0.15
cooldown = 20

[costs]
commission = 0.0003
minimum_commission = 5.0
sell_tax = 0.0005
slippage_bps = 10.0
participation = 0.05

[[instruments]]
symbol = "600000.SH"
stamp_tax = true

[[instruments]]
symbol = "000001.SZ"
stamp_tax = true

[[instruments]]
symbol = "600519.SH"
stamp_tax = true
