# 沪深北全市场扫描；分页和并发仅控制网络负载，不截断名单。
data = "../../.quant/full-market-daily.csv"
data_provider = "tencent" # 显式备用未复权日线源，不自动混合两家数据
initial_cash = 1000000
rebalance = "monthly"

[value]
fundamentals = "../../.quant/full-market-fundamentals.sqlite3"
frequency = "monthly" # 可改 quarterly；每日采集与股池重排是独立频率
top_n = "all"
max_pe = 25.0 # 最新已知年报EPS计算的PE，不是TTM
max_pb = 3.0
min_roe = 0.08 # 8%
max_debt_ratio = 0.70
min_cash_flow_per_share = 0.0
min_listing_days = 365
max_financial_age_days = 550
liquidity_window = 20
min_daily_amount = 20000000.0
max_per_industry = "all"
earnings_weight = 0.4
book_weight = 0.3
quality_weight = 0.3
excluded_industries = ["银行", "保险", "证券"]

[portfolio]
# 候选股池无限制；此处只限制实际资金持仓，月度择优并保留排名缓冲。
max_positions = 10
rank_buffer = 5
rebalance_tolerance = 0.20
minimum_trade_value = 5000

[strategy]
name = "dual_ma" # 也可换 momentum_rotation 等已有策略
fast = 50
slow = 200

[risk]
max_position = 0.15
max_gross = 0.90
max_drawdown = 0.20
stop_loss = 0.12
trailing_stop = 0.15
cooldown = 20

[costs]
commission = 0.0003
minimum_commission = 5.0
sell_tax = 0.0005
slippage_bps = 10.0
participation = 0.05


[market]
store = "../../.quant/full-market.sqlite3"
workers = 8
page_size = 500
history_start = "2024-01-01"
fractional_action = "floor"
